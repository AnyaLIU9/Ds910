# 供 01-04 脚本 source 的统一配置；不是可执行脚本。
MODEL_PATH="${MODEL_PATH:-/data/models/Tensor-0.1-Flash-35B-A3B}"
DEPLOY_DIR="${DEPLOY_DIR:-${MODEL_PATH}/deployment}"
RESULT_ROOT="${RESULT_ROOT:-${MODEL_PATH}/results/qwen36-vllm-npu3}"
IMAGE="${IMAGE:-quay.io/ascend/vllm-ascend:v0.19.1rc1-openeuler}"
CONTAINER_NAME="${CONTAINER_NAME:-qwen36-flash-npu3}"
NPU_ID="${NPU_ID:-3}"
SERVICE_PORT="${SERVICE_PORT:-9108}"
SERVED_MODEL_NAME="${SERVED_MODEL_NAME:-Tensor-0.1-Flash-35B-A3B}"
MAX_MODEL_LEN="${MAX_MODEL_LEN:-8192}"
MAX_NUM_SEQS="${MAX_NUM_SEQS:-32}"
MAX_NUM_BATCHED_TOKENS="${MAX_NUM_BATCHED_TOKENS:-8192}"
MEMORY_UTILIZATION="${MEMORY_UTILIZATION:-0.85}"

die() { echo "错误：$*" >&2; exit 1; }
require_container_running() {
  [[ "$(docker inspect -f '{{.State.Running}}' "${CONTAINER_NAME}" 2>/dev/null || true)" == "true" ]] || \
    die "容器 ${CONTAINER_NAME} 未运行；请先执行 01_create_container.sh"
}
